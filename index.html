<!doctype html>
<html lang="en">

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('✅ Service Worker Registered'))
          .catch((err) => console.log('❌ SW Error:', err));
      }
    </script>
